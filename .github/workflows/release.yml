name: Windows 11 Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Build Windows 11 installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Collector dependencies
        working-directory: private-collector
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build collector.exe sidecar
        working-directory: private-collector
        shell: pwsh
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: pnpm run build:windows

      - name: Verify Collector sidecar
        shell: pwsh
        run: |
          $sidecar = 'src-tauri/binaries/collector-x86_64-pc-windows-msvc.exe'
          if (!(Test-Path $sidecar)) {
            throw "Missing Collector sidecar: $sidecar"
          }
          $size = (Get-Item $sidecar).Length
          if ($size -lt 100000) {
            throw "Collector sidecar is unexpectedly small: $size bytes"
          }
          $collector = Start-Process -FilePath (Resolve-Path $sidecar) -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Milliseconds 250
              try {
                $response = Invoke-RestMethod 'http://127.0.0.1:8787/health' -TimeoutSec 2
                if ($response.ok -eq $true) { $healthy = $true; break }
              } catch { }
            }
            if (!$healthy) {
              throw 'Collector executable did not expose /health; SEA blob may not be embedded'
            }
          } finally {
            Stop-Process -Id $collector.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Collector sidecar ready and healthy: $sidecar ($size bytes)"

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Validate Tauri configuration
        run: pnpm tauri info

      - name: Build NSIS and MSI installers
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $nsis = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue
          $msi = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi' -ErrorAction SilentlyContinue
          if (!$nsis) { throw 'NSIS .exe installer was not produced' }
          if (!$msi) { throw 'MSI installer was not produced' }
          $nsis | ForEach-Object { Write-Host "NSIS: $($_.FullName)" }
          $msi | ForEach-Object { Write-Host "MSI: $($_.FullName)" }

      - name: Upload installers and sidecar as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shioaji-private-market-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/binaries/collector-x86_64-pc-windows-msvc.exe

      - name: Publish installers to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shioaji Private Market ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
