[package]
name = "shioaji-private-market"
version = "0.1.0"
description = "Shioaji Private Market desktop application"
authors = ["Private Market"]
edition = "2021"

[lib]
name = "shioaji_private_market_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
